<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TerraBeats – The Earth Information Jukebox: NASA Earth visualizations turned into real-time, accessible soundscapes. NASA Space Apps Challenge 2026." />
    <meta name="theme-color" content="#060a12" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      try {
        var v = JSON.parse(localStorage.getItem('terrabeats-view') || '{}');
        var r = document.documentElement;
        if (v.contrast) r.dataset.contrast = 'high';
        if (v.text && v.text !== 'normal') r.dataset.text = v.text;
        if (v.motion) r.dataset.motion = 'off';
      } catch (e) {}
    </script>
    <title>TerraBeats · The Earth Information Jukebox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
